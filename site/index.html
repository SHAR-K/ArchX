<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ArchCheck — code facts of public firmware repos</title>
  <meta name="description" content="What ArchCheck extracts from a C firmware repository: entries and reachability, dependencies, order and time, sharing and concurrency, state transitions. One snapshot per commit, every fact linked to its source line." />
  <meta property="og:type" content="website" />
  <meta property="og:title" content="ArchCheck — the runtime structure of C/C++ firmware" />
  <meta property="og:description" content="Interrupts, tasks, what one round of each does, and which state they share — recovered from the source of public firmware repositories. Every fact links to its line." />
  <meta property="og:image" content="https://shar-k.github.io/ArchX/og.png" />
  <meta property="og:image:width" content="1200" />
  <meta property="og:image:height" content="630" />
  <meta property="og:url" content="https://shar-k.github.io/ArchX/" />
  <meta name="twitter:card" content="summary_large_image" />
  <meta name="twitter:image" content="https://shar-k.github.io/ArchX/og.png" />
</head>
<body data-mode="stage">
  <script>
    // 语言在模块执行前定：i18n 在 import 时就读 body[data-lang]。?lang= 或按钮记住的选择，否则英文——不跟浏览器语言
    (function () {
      var q = new URLSearchParams(location.search).get("lang");
      var saved = null; try { saved = localStorage.getItem("archx.lang"); } catch (e) {}
      var lang = q || saved || "en";
      if (q) { try { localStorage.setItem("archx.lang", q); } catch (e) {} }
      document.body.dataset.lang = lang;
      document.documentElement.lang = lang.toLowerCase().startsWith("zh") ? "zh-CN" : "en";
    })();
  </script>
  <header class="site-bar">
    <a class="site-brand" href="https://github.com/SHAR-K/ArchX" title="ArchCheck on GitHub">ArchCheck</a>
    <select id="project" class="site-select" title="Which repository's facts to show"></select>
    <span id="meta" class="site-meta"></span>
    <span class="site-spacer"></span>
    <span class="site-note">One snapshot per commit · every fact links to its source line · to scan your own project: pip install archcheck</span>
    <a id="production-link" class="site-ghost" href="production/" title="The same panel on a larger production codebase">Production codebase →</a>
    <button id="lang" class="site-ghost" title="Switch language">中文</button>
  </header>
  <div id="root"></div>
  <script type="module" src="./main.tsx"></script>
</body>
</html>
