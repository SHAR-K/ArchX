<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>当前架构预览</title>
<style>
  :root { --bg: #f4f6f5; --surface: #fff; --line: #d8dedb; --text: #18211f; --muted: #68746f; --accent: #0f766e; --red: #b42318; --amber: #b45309; --purple: #6d28d9; --gray: #8a9791; }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; font: 13px/1.45 system-ui, "Segoe UI", sans-serif; color: var(--text); background: var(--bg); }
  .app { height: 100%; display: grid; grid-template-rows: 52px minmax(0, 1fr); }
  header { display: flex; align-items: center; gap: 14px; padding: 0 14px; background: #17201e; color: #fff; }
  header strong { font-size: 15px; }
  header .sub { color: #a9b4af; font-size: 12px; }
  header .stats { display: flex; gap: 16px; margin-left: auto; font-size: 12px; color: #c4cdc9; }
  header .stats b { color: #fff; font-size: 14px; }
  header .stats .bad b { color: #fca5a5; } header .stats .warn b { color: #fcd34d; }
  main { display: grid; grid-template-columns: minmax(0, 1fr) 400px; min-height: 0; }
  .stage { position: relative; min-width: 0; min-height: 0; }
  .tabs { position: absolute; z-index: 5; top: 10px; left: 12px; display: flex; gap: 2px; padding: 3px; border: 1px solid var(--line); border-radius: 6px; background: var(--surface); }
  .tabs button, .tools button { border: 0; border-radius: 4px; padding: 5px 10px; background: transparent; color: var(--text); cursor: pointer; font: inherit; }
  .tabs button.active { background: #dce9e6; color: #075f58; font-weight: 600; }
  svg.canvas { width: 100%; height: 100%; display: block; cursor: grab; }
  svg.canvas:active { cursor: grabbing; }
  .module rect.box { fill: #fff; stroke: #aebbb6; rx: 6; }
  .module.expanded rect.box { fill: rgba(255,255,255,.55); stroke-dasharray: 4 3; }
  .module.selected rect.box { stroke: var(--accent); stroke-width: 2; }
  .module .title { font-size: 13px; font-weight: 650; }
  .module .meta { font-size: 11px; fill: var(--muted); }
  .file rect.box { fill: #fff; stroke: #c4cec9; rx: 4; }
  .file.cycle rect.box { stroke: var(--purple); stroke-dasharray: 3 2; }
  .file.selected rect.box { stroke: var(--accent); stroke-width: 2; }
  .file .title { font-size: 12px; font-weight: 600; }
  .file .meta { font-size: 10px; fill: var(--muted); }
  .badge rect { rx: 3; }
  .badge text { font-size: 10px; font-weight: 700; fill: #fff; }
  .badge.up rect { fill: var(--red); } .badge.skip rect { fill: var(--amber); } .badge.ext rect { fill: #9aa5a0; } .badge.cyc rect { fill: var(--purple); } .badge.cfg rect { fill: #b8a95a; }
  .dim { opacity: .35; }
  .edge path.line { fill: none; stroke: var(--gray); }
  .edge.up path.line { stroke: var(--red); }
  .edge.skip path.line { stroke: var(--amber); }
  .edge.selected path.line { stroke: var(--accent) !important; }
  .edge .count { font-size: 11px; fill: var(--text); font-weight: 600; }
  .edge .count-bg { fill: #fff; stroke: var(--line); rx: 3; }
  .edge.up .count { fill: var(--red); }
  .edge.skip .count { fill: var(--amber); }
  .flow-hint { fill: var(--muted); font-size: 12px; }
  aside { min-height: 0; overflow: auto; border-left: 1px solid var(--line); background: var(--surface); padding: 12px 14px; }
  aside h2 { margin: 0 0 4px; font-size: 15px; }
  aside h3 { margin: 16px 0 6px; font-size: 11px; color: var(--muted); text-transform: uppercase; letter-spacing: .04em; }
  aside .sub { color: var(--muted); font-size: 12px; }
  aside table { width: 100%; border-collapse: collapse; font-size: 12px; }
  aside td, aside th { padding: 5px 6px; border-bottom: 1px solid var(--line); text-align: left; vertical-align: top; }
  aside th { color: var(--muted); font-weight: 600; }
  aside td.num { text-align: right; font-variant-numeric: tabular-nums; white-space: nowrap; }
  aside code { font-family: ui-monospace, Consolas, monospace; font-size: 11px; overflow-wrap: anywhere; }
  aside .chip { display: inline-block; padding: 1px 6px; margin: 0 4px 2px 0; border-radius: 4px; border: 1px solid var(--line); font-size: 11px; color: var(--muted); }
  aside .chip.up { border-color: var(--red); color: var(--red); } aside .chip.skip { border-color: var(--amber); color: var(--amber); } aside .chip.cycle { border-color: var(--purple); color: var(--purple); }
  aside button.link { border: 0; background: none; color: var(--accent); cursor: pointer; padding: 0; font: inherit; text-align: left; }
  aside .start li { margin: 6px 0; }
  .panel { position: absolute; inset: 0; overflow: auto; padding: 60px 16px 16px; background: var(--bg); }
  .panel table { border-collapse: collapse; background: var(--surface); font-size: 12px; }
  .panel th, .panel td { border: 1px solid var(--line); padding: 4px 6px; }
  .panel th { background: #eef1ef; font-weight: 600; }
  .panel td.num { text-align: right; font-variant-numeric: tabular-nums; cursor: pointer; }
  .panel td.up { background: #fde2e1; color: var(--red); font-weight: 700; }
  .panel td.skip { background: #fdebd3; color: var(--amber); }
  .panel td.down, .panel td.same { background: #e7f5ef; }
  .panel td.self { background: #f1f3f2; color: var(--muted); }
  .panel th.rowhead { text-align: left; white-space: nowrap; }
  .panel .note { color: var(--muted); font-size: 12px; margin: 0 0 10px; }
  .hidden { display: none !important; }
  /* 入口页 */
  .entries { max-width: none; }
  .entries .brief { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 1px; margin-bottom: 14px; border: 1px solid var(--line); background: var(--line); }
  .entries .brief div { background: var(--surface); padding: 10px 12px; }
  .entries .brief b { display: block; font-size: 20px; }
  .entries .brief span { color: var(--muted); font-size: 12px; }
  .entries .brief .bad b { color: var(--red); } .entries .brief .warn b { color: var(--amber); }
  .entries h2 { margin: 18px 0 8px; font-size: 14px; }
  .entries h2 small { color: var(--muted); font-weight: 400; margin-left: 8px; }
  .tree details { margin: 2px 0 2px 0; border-left: 2px solid var(--line); }
  .tree details > details, .tree details > .reg { margin-left: 18px; }
  .tree summary { list-style: none; cursor: pointer; padding: 5px 8px; display: flex; align-items: center; gap: 8px; flex-wrap: wrap; border-radius: 4px; }
  .tree summary::-webkit-details-marker { display: none; }
  .tree summary::before { content: "▸"; color: var(--muted); width: 10px; }
  .tree details[open] > summary::before { content: "▾"; }
  .tree summary:hover { background: #eef3f1; }
  .tree summary.leaf::before { content: "·"; }
  .tree .fn { font-weight: 600; }
  .tree .loc { color: var(--muted); font-size: 11px; }
  .tree .reg { display: flex; align-items: center; gap: 8px; padding: 3px 8px 3px 26px; font-size: 12px; }
  .tree .reg::before { content: "⟶"; color: var(--muted); }
  .tag { display: inline-block; padding: 0 6px; border-radius: 3px; font-size: 11px; font-weight: 600; color: #fff; background: #9aa5a0; }
  .tag.task { background: #2563eb; } .tag.handler { background: #0f766e; } .tag.isr { background: #dc2626; } .tag.irq { background: #b45309; } .tag.lib { background: #9aa5a0; } .tag.kernel { background: #6b7280; } .tag.warn { background: var(--amber); } .tag.mixed { background: #7c3aed; }
  .entry-btn { border: 0; background: none; color: var(--accent); cursor: pointer; font: inherit; padding: 0; }
  .entry-btn:hover { text-decoration: underline; }
  .isr-group { margin: 6px 0; padding: 8px 10px; border: 1px solid var(--line); background: var(--surface); border-radius: 6px; }
  .isr-group h3 { margin: 0 0 6px; font-size: 12px; color: var(--muted); }
  .isr-row { display: grid; grid-template-columns: 220px 1fr 1fr 90px; gap: 10px; padding: 4px 0; border-top: 1px solid var(--line); font-size: 12px; align-items: baseline; }
  .isr-row .sub { color: var(--muted); }
  .anomaly { padding: 6px 10px; margin: 4px 0; border-left: 3px solid var(--amber); background: var(--surface); font-size: 12px; }
  .search { display: flex; gap: 6px; margin-bottom: 10px; }
  .search input { flex: 1; padding: 6px 8px; border: 1px solid var(--line); border-radius: 4px; font: inherit; }
  .chain { list-style: none; padding: 0; margin: 0; }
  .chain li { padding: 4px 0 4px 14px; border-left: 2px solid var(--line); font-size: 12px; position: relative; }
  .chain li em { color: var(--muted); font-style: normal; font-size: 11px; margin-left: 6px; }
  /* 执行树 */
  .treebar { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; margin-bottom: 10px; }
  .treebar select { padding: 5px 8px; border: 1px solid var(--line); border-radius: 4px; font: inherit; background: var(--surface); max-width: 360px; }
  .treebar .toggle { border: 1px solid var(--line); border-radius: 4px; padding: 4px 9px; background: var(--surface); cursor: pointer; font: inherit; color: var(--muted); }
  .treebar .toggle.active { color: var(--accent); border-color: var(--accent); }
  .order { display: flex; flex-wrap: wrap; align-items: center; gap: 4px; margin: 0 0 12px; font-size: 12px; color: var(--muted); }
  .order .step { padding: 2px 8px; border: 1px solid var(--line); border-radius: 10px; background: var(--surface); color: var(--text); }
  .order .step small { color: var(--muted); margin-left: 4px; }
  .xtree details { border-left: 2px solid var(--line); margin: 1px 0; }
  .xtree details > * { margin-left: 16px; }
  .xtree details > summary { margin-left: 0; }
  .xtree summary { list-style: none; cursor: pointer; padding: 3px 8px; display: flex; align-items: center; gap: 7px; flex-wrap: wrap; border-radius: 4px; font-size: 12.5px; }
  .xtree summary::-webkit-details-marker { display: none; }
  .xtree summary::before { content: "▸"; color: var(--muted); width: 10px; flex: none; }
  .xtree details[open] > summary::before { content: "▾"; }
  .xtree summary.leaf::before { content: "·"; }
  .xtree summary:hover { background: #eef3f1; }
  .xtree .fn { font-weight: 600; }
  .xtree .loc { color: var(--muted); font-size: 11px; }
  .xtree .edge { font-size: 11px; padding: 0 5px; border-radius: 3px; color: #fff; }
  .xtree .edge.register { background: #2563eb; } .xtree .edge.schedule { background: #7c3aed; } .xtree .edge.irq { background: #b45309; } .xtree .edge.cycle { background: #6b7280; } .xtree .edge.seen { background: #9aa5a0; }
  .xtree .mod { font-size: 11px; padding: 0 6px; border-radius: 3px; background: #e6ece9; color: #36423e; }
  .xtree .mod.cross { background: #fde68a; color: #7a4b00; }
  .xtree .group > summary { color: var(--muted); }
  .xtree .group > summary .mod { font-weight: 600; }
  .xtree .count { color: var(--muted); font-size: 11px; margin-left: auto; }
  .xtree .warn-tag { background: var(--red); color: #fff; font-size: 11px; padding: 0 5px; border-radius: 3px; }
  .xtree .dom { font-size: 11px; padding: 0 5px; border-radius: 3px; color: #fff; }
  .xtree .dom.mixed { background: #7c3aed; } .xtree .dom.isr { background: #dc2626; }
  .xtree .note { color: var(--muted); font-size: 11px; }
  /* 执行树画布 */
  .treebar .seg { display: inline-flex; border: 1px solid var(--line); border-radius: 4px; overflow: hidden; }
  .treebar .seg button { border: 0; border-radius: 0; padding: 4px 10px; background: var(--surface); color: var(--muted); cursor: pointer; font: inherit; }
  .treebar .seg button.active { background: #dce9e6; color: #075f58; font-weight: 600; }
  .tcanvas-wrap { position: relative; height: calc(100vh - 230px); min-height: 420px; border: 1px solid var(--line); border-radius: 6px; background: var(--surface); overflow: hidden; }
  svg.tcanvas { width: 100%; height: 100%; display: block; cursor: grab; }
  svg.tcanvas:active { cursor: grabbing; }
  .tcanvas .tn rect.card { fill: #fff; stroke: #b9c4bf; rx: 5; }
  .tcanvas .tn:hover rect.card { stroke: var(--accent); }
  .tcanvas .tn.open rect.card { stroke: #7a8a84; }
  .tcanvas .tn.selected rect.card { stroke: var(--accent); stroke-width: 2; }
  .tcanvas .tn.bypass rect.card { stroke: var(--red); stroke-width: 1.6; }
  .tcanvas .tn.group rect.card { fill: #fff7d6; stroke: #d4b05a; stroke-dasharray: 4 3; }
  .tcanvas .tn.seen rect.card { fill: #f1f3f2; stroke: #c4cec9; stroke-dasharray: 3 3; }
  .tcanvas .tn .name { font-size: 12px; font-weight: 600; fill: var(--text); }
  .tcanvas .tn.seen .name, .tcanvas .tn.cycle .name { fill: var(--muted); font-weight: 500; }
  .tcanvas .tn .sub { font-size: 10px; fill: var(--muted); }
  .tcanvas .tn .cnt { font-size: 10px; fill: #fff; font-weight: 700; }
  .tcanvas .tn rect.cntbg { fill: #7a8a84; rx: 8; }
  .tcanvas .tn.root rect.card { fill: #17201e; }
  .tcanvas .tn.root .name, .tcanvas .tn.root .sub { fill: #fff; }
  .tcanvas .tn .modtag rect { fill: #fde68a; rx: 3; } .tcanvas .tn .modtag text { fill: #7a4b00; font-size: 10px; font-weight: 600; }
  .tcanvas .tn .dot { r: 4; }
  .tcanvas .te path { fill: none; stroke: #9aa5a0; stroke-width: 1.4; }
  .tcanvas .te.register path { stroke: #2563eb; } .tcanvas .te.schedule path { stroke: #7c3aed; stroke-dasharray: 5 4; } .tcanvas .te.irq path { stroke: #b45309; } .tcanvas .te.seen path, .tcanvas .te.cycle path { stroke: #c4cec9; stroke-dasharray: 3 3; }
  .tcanvas .te .lbl rect { rx: 3; } .tcanvas .te .lbl text { fill: #fff; font-size: 10px; font-weight: 600; }
  .tcanvas .te.register .lbl rect { fill: #2563eb; } .tcanvas .te.schedule .lbl rect { fill: #7c3aed; } .tcanvas .te.irq .lbl rect { fill: #b45309; }
  .tcanvas .depth-label { font-size: 11px; fill: var(--muted); }
  .tcanvas-hint { position: absolute; left: 10px; bottom: 8px; padding: 4px 8px; border: 1px solid var(--line); border-radius: 4px; background: rgba(255,255,255,.92); color: var(--muted); font-size: 11px; }
  .tcanvas-tools { position: absolute; right: 10px; top: 8px; display: flex; gap: 6px; }
  .tcanvas-tools button { border: 1px solid var(--line); border-radius: 4px; background: var(--surface); padding: 3px 8px; font: inherit; cursor: pointer; }
  .xtree .edge-btn { border: 0; background: none; color: var(--muted); font: inherit; font-size: 11px; cursor: pointer; padding: 0 3px; border-radius: 3px; }
  .xtree .edge-btn:hover { background: #dce9e6; color: var(--accent); }
  .tcanvas .te path.hit { fill: none; stroke: transparent; stroke-width: 12; cursor: pointer; }
  .tcanvas .te.selected path.line { stroke: var(--accent) !important; stroke-width: 2.4; }
  /* 双根对比 */
  .cmp-matrix { border-collapse: collapse; font-size: 11px; background: var(--surface); }
  .cmp-matrix th, .cmp-matrix td { border: 1px solid var(--line); padding: 3px 6px; text-align: center; }
  .cmp-matrix th { background: #eef1ef; font-weight: 600; white-space: nowrap; }
  .cmp-matrix th.rowhead { text-align: left; }
  .cmp-matrix td.cell { cursor: pointer; font-variant-numeric: tabular-nums; min-width: 34px; }
  .cmp-matrix td.cell:hover { outline: 2px solid var(--accent); }
  .cmp-matrix td.cell.selected { outline: 2px solid var(--accent); font-weight: 700; }
  .cmp-matrix th.colhead { writing-mode: vertical-rl; transform: rotate(180deg); max-height: 150px; font-weight: 500; }
  .cmp-head { display: grid; grid-template-columns: 1fr auto 1fr; gap: 12px; align-items: center; margin: 12px 0; }
  .cmp-root { padding: 10px 12px; border: 1px solid var(--line); border-radius: 6px; background: var(--surface); }
  .cmp-root b { display: block; font-size: 14px; }
  .cmp-root .sub { color: var(--muted); font-size: 12px; }
  .cmp-root.isr { border-left: 4px solid #dc2626; } .cmp-root.task { border-left: 4px solid #2563eb; }
  .cmp-mid { text-align: center; color: var(--muted); font-size: 12px; }
  .cmp-mid b { display: block; font-size: 22px; color: var(--text); }
  .cmp-table { width: 100%; border-collapse: collapse; background: var(--surface); font-size: 12px; margin-bottom: 14px; }
  .cmp-table th, .cmp-table td { border-bottom: 1px solid var(--line); padding: 5px 8px; text-align: left; vertical-align: top; }
  .cmp-table th { color: var(--muted); font-weight: 600; font-size: 11px; white-space: nowrap; }
  .cmp-table td.nowrap { white-space: nowrap; }
  .brief { color: var(--muted); font-style: italic; overflow-wrap: anywhere; }
  .cmp-table td.num { text-align: right; font-variant-numeric: tabular-nums; }
  .cmp-note { color: var(--muted); font-size: 12px; margin: 0 0 8px; }
  /* AST 层：运行模式、读写矩阵、状态图 */
  .mode { display: inline-block; font-size: 10px; padding: 1px 6px; border-radius: 9px; margin-left: 4px; vertical-align: middle; border: 1px solid transparent; }
  .mode.periodic { background: #dcfce7; color: #166534; } .mode.busy-poll { background: #fef3c7; color: #92400e; } .mode.event-driven { background: #dbeafe; color: #1e40af; } .mode.one-shot { background: #ede9fe; color: #5b21b6; } .mode.unknown { background: #f1f5f9; color: #64748b; }
  .mode-strip { display: flex; gap: 14px; flex-wrap: wrap; margin: 6px 0 14px; }
  .mode-strip .grp { border: 1px solid var(--line); border-radius: 6px; padding: 6px 10px; background: var(--surface); min-width: 120px; }
  .mode-strip .grp b { display: block; font-size: 12px; margin-bottom: 4px; }
  .mode-strip .grp .entry-btn { display: block; text-align: left; font-size: 12px; }
  .conf { display: inline-block; width: 9px; height: 9px; border-radius: 50%; margin-right: 6px; vertical-align: middle; }
  .conf.high { background: #dc2626; } .conf.medium { background: #f59e0b; } .conf.low { background: #94a3b8; }
  .rw { border-collapse: collapse; font-size: 11px; background: var(--surface); }
  .rw th, .rw td { border: 1px solid var(--line); padding: 3px 6px; text-align: center; white-space: nowrap; }
  .rw th.colhead { writing-mode: vertical-rl; transform: rotate(180deg); max-height: 170px; font-weight: 500; }
  .rw th.colhead.isr { color: #b91c1c; } .rw th.colhead.task { color: #1d4ed8; } .rw th.colhead.callback { color: #7c3aed; } .rw th.colhead.main { color: #64748b; }
  .rw th.rowhead { text-align: left; font-weight: 600; cursor: pointer; }
  .rw tr:hover th.rowhead { text-decoration: underline; }
  .rw td.cell { font-family: ui-monospace, Consolas, monospace; font-weight: 700; min-width: 30px; }
  .rw td.cell.w { background: #fee2e2; color: #991b1b; } .rw td.cell.r { background: #eff6ff; color: #1e3a8a; } .rw td.cell.rw { background: #fde68a; color: #78350f; } .rw td.cell.addr { background: #f1f5f9; color: #475569; }
  .rw td.cell.locked { outline: 2px solid #16a34a; outline-offset: -2px; }
  .tag.notify { background: #e0f2fe; color: #075985; }
  .seq-svg .seg rect { fill: rgba(59,130,246,.08); stroke: #93c5fd; } .seq-svg .seg.masked rect { fill: rgba(22,163,74,.10); stroke: #86efac; } .seq-svg .seg text { fill: #1e3a8a; }
  .seq-svg .seg:hover rect { stroke: var(--accent); }
  .seq-svg .wake line { stroke: #0284c7; stroke-width: 1.4; stroke-dasharray: 2 3; marker-end: url(#seq-arrow-blue); } .seq-svg .wake text { fill: #075985; }
  .rw-glyph { display: inline-block; font-family: ui-monospace, Consolas, monospace; font-weight: 700; font-size: 11px; padding: 1px 6px; border-radius: 4px; }
  .rw-glyph.w { background: #fee2e2; color: #991b1b; } .rw-glyph.r { background: #eff6ff; color: #1e3a8a; } .rw-glyph.rw { background: #fde68a; color: #78350f; } .rw-glyph.addr { background: #f1f5f9; color: #475569; }
  .rw tr.selected th.rowhead { background: #ede9fe; }
  .fsm-list { display: grid; grid-template-columns: repeat(auto-fill, minmax(230px, 1fr)); gap: 8px; margin-bottom: 12px; }
  .fsm-card { border: 1px solid var(--line); border-radius: 6px; padding: 8px 10px; background: var(--surface); cursor: pointer; font-size: 12px; }
  .fsm-card:hover { border-color: var(--accent); } .fsm-card.selected { border-color: var(--accent); box-shadow: 0 0 0 2px rgba(124,58,237,.2); }
  .fsm-card b { display: block; font-size: 13px; } .fsm-card .sub { color: var(--muted); }
  .fsm-svg { width: 100%; height: 520px; background: var(--surface); border: 1px solid var(--line); border-radius: 6px; }
  .fsm-svg .st rect { fill: #fff; stroke: #64748b; stroke-width: 1.2; rx: 6; } .fsm-svg .st text { font-size: 11px; fill: #0f172a; }
  .fsm-svg .st.hot rect { stroke: #dc2626; stroke-width: 2; }
  .fsm-svg .tr path { fill: none; stroke: #7c3aed; stroke-width: 1.3; marker-end: url(#fsm-arrow); opacity: .85; }
  .fsm-svg .tr.call path { stroke-dasharray: 4 3; }
  .fsm-svg .tr text { font-size: 9px; fill: #6b21a8; }
  .fsm-svg .tr:hover path { stroke-width: 2.4; opacity: 1; }
  .fsm-svg.track .st.terminal rect { stroke: #64748b; stroke-dasharray: 4 2; fill: #f8fafc; }
  .fsm-svg.track .st.helper rect { stroke: #64748b; fill: #f8fafc; }
  .fsm-svg.uml .st rect { fill: #fff; stroke: #475569; stroke-width: 1.3; rx: 10; }

  </header>

        <button data-tab="run">运行图</button>

      <div class="panel hidden" id="panel-isr"></div>

    </div>
    <aside id="aside"></aside>
  </main>

<script>
(() => {
  const F = window.__FACTS__;
  const $ = (id) => document.getElementById(id);
  const esc = (value) => String(value ?? "").replace(/[&<>"]/g, (ch) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" })[ch]);
  const moduleById = new Map(F.modules.map((m) => [m.id, m]));
  const fileById = new Map(F.files.map((f) => [f.path, f]));
  const fnById = new Map(F.functions.map((fn) => [fn.id, fn]));
  const cycleFiles = new Set(F.cycles.flat());
  const rankOf = (m) => (m.external ? null : m.crosscutting ? null : m.rank);
  const layerDefs = F.layers.filter((l) => !l.crosscutting && l.rank != null).sort((a, b) => a.rank - b.rank);
  const layerId = (rank) => `layer:${rank}`;
  const modulesOfLayer = (rank) => F.modules.filter((m) => rankOf(m) === rank).sort((a, b) => a.name.localeCompare(b.name));
  const state = { tab: "entries" };

  // 模块级统计（不随展开状态变化）
  function classify(a, b) {
    if (!a || !b) return "boundary";
    if (a.external || b.external) return "boundary";
    if (a.crosscutting || b.crosscutting) return "crosscutting";
    if (a.rank == null || b.rank == null) return "unknown";
    if (a.rank === b.rank) return "same";
    if (a.rank > b.rank) return "up";
    return b.rank - a.rank > 1 ? "skip" : "down";
  }
  const moduleEdges = (() => {
    const map = new Map();
    for (const e of F.includeEdges) {
      const s = fileById.get(e.s), t = fileById.get(e.t); if (!s || !t || s.module === t.module) continue;
      const key = `${s.module}→${t.module}`;
      const rec = map.get(key) ?? { s: s.module, t: t.module, includes: 0, calls: 0, cls: classify(moduleById.get(s.module), moduleById.get(t.module)), pairs: [] };
      rec.includes += 1; rec.pairs.push(e); map.set(key, rec);
    }
    for (const c of F.callPairs) { const sf = fnById.get(c.s), tf = fnById.get(c.t); if (!sf || !tf) continue; const a = fileById.get(sf.file)?.module, b = fileById.get(tf.file)?.module; if (!a || !b || a === b) continue; const rec = map.get(`${a}→${b}`); if (rec) rec.calls += 1; }
    return [...map.values()];
  })();
  // 右栏
  const aside = $("aside");
  const fileLink = (path) => `<button class="link" data-open-file="${esc(path)}"><code>${esc(path.replace(F.region, ""))}</code></button>`;
  const moduleLink = (id) => `<button class="link" data-open-module="${esc(id)}">${esc(moduleById.get(id)?.name ?? id)}</button>`;
  const clsLabel = (cls) => ({ same: "同层", down: "正向", up: "反向", skip: "越层", crosscutting: "横切配置", boundary: "外部", unknown: "未声明层" }[cls] ?? cls);
  function wire() {
    aside.querySelectorAll("[data-open-file]").forEach((el) => el.addEventListener("click", () => { location.href = codeHref(el.dataset.openFile); }));
    aside.querySelectorAll("[data-open-module]").forEach((el) => el.addEventListener("click", () => { deps.sel = el.dataset.openModule; switchTab("deps"); }));
    aside.querySelectorAll("[data-open-edge]").forEach((el) => el.addEventListener("click", () => { const [s, tgt] = el.dataset.openEdge.split("|"); const e = moduleEdges.find((x) => x.s === s && x.t === tgt); if (e) showEdge({ ...e, id: `${s}→${tgt}` }); }));
  }
  function showEdge(e) {
    const pairs = new Map(); for (const p of e.pairs) { const key = `${p.s}→${p.t}`; pairs.set(key, (pairs.get(key) ?? { s: p.s, t: p.t, calls: [] })); }
    for (const c of F.callPairs) { const sf = fnById.get(c.s), tf = fnById.get(c.t); if (!sf || !tf) continue; const rec = pairs.get(`${sf.file}→${tf.file}`); if (rec) rec.calls.push(c); }
    const rows = [...pairs.values()].sort((a, b) => b.calls.length - a.calls.length);
    const name = (id) => id.startsWith("layer:") ? `L${id.slice(6)} ${layerDefs.find((l) => l.rank === Number(id.slice(6)))?.name}` : moduleById.get(id)?.name ?? fileById.get(id)?.name ?? id;
    aside.innerHTML = `<h2>${esc(name(e.s))} → ${esc(name(e.t))}</h2><p class="sub"><span class="chip ${e.cls}">${clsLabel(e.cls)}</span>${e.includes} 条 include 边 · ${e.calls} 次函数调用</p>
      <h3>文件对 ${rows.length}</h3><table>${rows.map((r) => `<tr><td>${fileLink(r.s)}<br>→ ${fileLink(r.t)}</td><td class="num">${r.calls.length} 调用</td></tr>`).join("")}</table>
      <h3>函数调用（前 40）</h3><table>${rows.flatMap((r) => r.calls).slice(0, 40).map((c) => { const sf = fnById.get(c.s), tf = fnById.get(c.t); return `<tr><td><code>${esc(sf.name)}</code> <span class="sub">${esc(fileById.get(sf.file)?.name)}:${c.line ?? "?"}</span><br>→ <code>${esc(tf.name)}</code> <span class="sub">${esc(fileById.get(tf.file)?.name)}</span></td></tr>`; }).join("") || "<tr><td>仅 include，无函数调用</td></tr>"}</table>`;
    wire();
  }

  // 其他页签
  // parts:js —— tools/preview/*.js 按文件名顺序拼接到这里
  // ---- 入口页：启动树、注册、中断、可达性
  const E = F.entries;
  // 可达性沿调用边 + 注册边（取函数地址装进系统）走；使能边单独存，中断体不算在使能者"下面"
  const callersOf = new Map(), calleesOf = new Map(), irqPairsOf = new Map();
  for (const c of [...F.callPairs, ...F.registerPairs]) { calleesOf.set(c.s, [...(calleesOf.get(c.s) ?? []), c]); callersOf.set(c.t, [...(callersOf.get(c.t) ?? []), c]); }
  for (const c of F.irqPairs) irqPairsOf.set(c.s, [...(irqPairsOf.get(c.s) ?? []), c]);
  const bypassSet = new Set(F.contractBypass.map((b) => `${b.s}→${b.t}`));
  const fname = (id) => fnById.get(id)?.name ?? String(id).split(":").pop();
  const floc = (id) => { const f = fnById.get(id); return f ? (f.external ? `闭源库 ${f.file.replace(/^lib:/, "")}` : `${f.file.split("/").pop()}:${f.line}`) : ""; };
  const fmodule = (id) => { const f = fnById.get(id); return f ? (fileById.get(f.file)?.module ?? f.file.split("/").slice(0, 2).join("/")) : "?"; };
  const isRegionFnId = (id) => (fnById.get(id)?.file ?? "").startsWith(F.region);
  const domainLabel = { isr: "中断", task: "任务", main: "启动", mixed: "中断+任务", unreached: "未触达" };
  const rootLabel = { main: "main 启动路径", task: "任务", callback: "回调", isr: "中断" };
  const isrIds = new Set(E.isrs.map((i) => i.id));
  const regById = new Map(E.registrations.map((r) => [r.id, r]));
  const regKind = (id) => regById.get(id)?.kind ?? null;
  // 调度器按框架规则查表：protothreads 的任务由 thread_run 轮询；这是框架事实，不是按名字猜
  const schedulerByRule = { "protothreads.thread_create": "thread_run" };
  const schedulerNames = new Set(E.registrations.map((r) => schedulerByRule[r.rule]).filter(Boolean));
  const under = (id) => { const seen = new Set([id]); const q = [id]; while (q.length) { const x = q.shift(); for (const c of calleesOf.get(x) ?? []) if (!seen.has(c.t)) { seen.add(c.t); q.push(c.t); } } seen.delete(id); return seen; };
  const moduleDist = (ids) => { const m = new Map(); for (const id of ids) m.set(fmodule(id), (m.get(fmodule(id)) ?? 0) + 1); return [...m.entries()].sort((a, b) => b[1] - a[1]); };
  const entryButton = (id, extra = "") => `<button class="entry-btn" data-entry="${esc(id)}">${esc(fname(id))}</button>${extra}`;

  function renderBootNode(node, depth) {
    const reg = node.registrations, tasks = reg.filter((r) => r.kind === "task"), handlers = reg.filter((r) => r.kind === "handler");
    const badges = `${tasks.length ? `<span class="tag task">注册任务 ${tasks.length}</span>` : ""}${handlers.length ? `<span class="tag handler">注册处理器 ${handlers.length}</span>` : ""}${node.irqEnables ? `<span class="tag irq" title="${esc((node.irqTargets ?? []).map((t) => fname(t.id)).join(", "))}">使能中断 ${node.irqEnables}</span>` : ""}${node.plainCalls ? `<span class="tag lib" title="这些调用的子树里没有注册入口或使能中断，在执行树里能看到">另 ${node.plainCalls} 个纯初始化调用</span>` : ""}`;
    const leaf = !node.children.length && !reg.length;
    const body = `${reg.map((r) => `<div class="reg"><span class="tag ${r.kind}">${r.kind === "task" ? "任务" : "处理器"}</span>${entryButton(r.id)}${modePill(r.id)}<span class="loc">${esc(floc(r.id))}</span>${r.kind === "task" ? `<span class="loc">下面 ${under(r.id).size} 个函数</span>` : ""}</div>`).join("")}${node.children.map((child) => renderBootNode(child, depth + 1)).join("")}`;

    const edgeTag = edge ? `<span class="edge ${edge.kind}">${{ register: "注册", schedule: "调度·推导", irq: "⚡ 使能", call: "" }[edge.kind]}</span>` : "";
    const parentId = ancestors.length ? ancestors[ancestors.length - 1] : null;
    const lineTag = edge && parentId ? `<button class="edge-btn" data-edge-from="${esc(parentId)}" data-edge-to="${esc(id)}" data-edge-kind="${edge.kind}" title="这条边的证据：调用点、include 路径、被调导出面">${edge.line ? `:${edge.line}` : "边"} ⓘ</button>` : "";
    const modTag = f.external ? `<span class="tag lib" title="只有声明，定义在 ${esc(f.file.replace(/^lib:/, ""))}">闭源库</span>` : cross ? `<span class="mod cross">→ ${esc(module)}</span>` : "";
    const bypassTag = edge?.kind === "call" && cross && ancestors.length && bypassesHeader(ancestors[ancestors.length - 1], id) ? `<span class="warn-tag">未经头文件</span>` : "";
    const domTag = domain === "mixed" ? `<span class="dom mixed">中断+任务</span>` : domain === "isr" && !ancestors.some((a) => isrIds.has(a)) && !isrIds.has(id) ? `<span class="dom isr">中断</span>` : "";
    if (edge?.kind === "irq") return `<details><summary class="leaf">${edgeTag}<span class="fn"><button class="entry-btn" data-tree-fn="${esc(id)}">${esc(f.name)}</button></span>${lineTag}<span class="note">中断入口，下面 ${underCount(id)} 个函数；从"从哪个入口开始"选它可展开</span></summary></details>`;
    if (ancestors.includes(id)) return `<details><summary class="leaf">${edgeTag}<span class="edge cycle">↺ 回到</span><span class="fn">${esc(f.name)}</span>${lineTag}</summary></details>`;
    const seenAt = tree.rendered.get(id);
    const domId = `tn-${++tree.counter}`;
    if (seenAt) return `<details id="${domId}"><summary class="leaf">${edgeTag}<span class="fn"><button class="entry-btn" data-tree-fn="${esc(id)}">${esc(f.name)}</button></span>${lineTag}${modTag}<a class="edge seen" href="#${seenAt}" style="text-decoration:none">已出现，跳转</a></summary></details>`;
    tree.rendered.set(id, domId);
    const count = underCount(id);
    const kids = treeChildren(id);
    const scheduled = kids.filter((k) => k.kind === "schedule").length;
    const countLabel = scheduled ? `调度 ${scheduled} 个任务（推导）` : count ? `下面 ${count}` : "";
    const open = tree.openPath.has(id) || ancestors.length === 0;
    return `<details id="${domId}" data-tree-node="${esc(id)}" data-anc="${esc(ancestors.join("|"))}" ${open ? "open" : ""}><summary class="${kids.length ? "" : "leaf"}">${edgeTag}<span class="fn"><button class="entry-btn" data-tree-fn="${esc(id)}">${esc(f.name)}</button></span><span class="loc">${esc(floc(id))}</span>${lineTag}${modTag}${bypassTag}${domTag}<span class="count">${countLabel}</span></summary><div class="kids">${open ? renderTreeChildren(id, [...ancestors, id]) : ""}</div></details>`;
  }

  function renderTreeChildren(id, ancestors) {
    const children = treeChildren(id);
    if (!children.length) return "";
    if (!tree.groupByModule) return children.map((c) => renderTreeNode(c.target, ancestors, c)).join("");
    const module = fmodule(id);
    const same = [], groups = new Map();
    for (const c of children) { const m = c.kind === "irq" ? module : fmodule(c.target); if (m === module || c.kind === "schedule") same.push(c); else groups.set(m, [...(groups.get(m) ?? []), c]); }
    // 只有一个函数的跨模块组不折叠：折叠只为减少数量，单个节点折叠只会多一次点击
    const singles = [...groups.entries()].filter(([, list]) => list.length === 1).map(([, list]) => list[0]);
    for (const [m, list] of [...groups.entries()]) if (list.length === 1) groups.delete(m);
    const inline = [...same, ...singles].sort((a, b) => (a.line ?? Infinity) - (b.line ?? Infinity));
    let html = inline.map((c) => renderTreeNode(c.target, ancestors, c)).join("");
    for (const [m, list] of groups) {
      const open = list.some((c) => tree.openPath.has(c.target));
      html += `<details class="group" ${open ? "open" : ""}><summary><span class="mod cross">→ ${esc(m)}</span><span class="note">${list.length} 个函数${list.some((c) => bypassesHeader(id, c.target)) ? ' · <span class="warn-tag">含未经头文件的调用</span>' : ""}</span></summary><div class="kids">${list.map((c) => renderTreeNode(c.target, ancestors, c)).join("")}</div></details>`;
    }
    return html;
  }

  function activationOrder(rootId) {
    const order = []; const seenModules = new Set(); const seenFns = new Set([rootId]);
    const walk = (id) => { const m = fmodule(id); if (!seenModules.has(m)) { seenModules.add(m); order.push({ module: m, via: id }); } for (const c of treeChildren(id)) { if (c.kind === "irq" || seenFns.has(c.target)) continue; seenFns.add(c.target); walk(c.target); } };
    walk(rootId);
    return order;
  }

  // ---- 边的证据：调用点、include 路径（或 extern 绕过）、被调导出面
  function includePath(fromFile, toFile) {
    const toModule = fileById.get(toFile)?.module; const toStem = toFile.split("/").pop().replace(/\.(c|h)$/, "");
    const prev = new Map([[fromFile, null]]); const queue = [fromFile]; let depth = 0;
    while (queue.length && depth < 5) {
      const next = [];
      for (const f of queue) for (const h of includesOf.get(f) ?? []) {
        if (prev.has(h)) continue; prev.set(h, f);
        const stem = h.split("/").pop().replace(/\.(c|h)$/, "");
        if (stem === toStem || (toModule && fileById.get(h)?.module === toModule)) { const chain = [h]; let cur = f; while (cur) { chain.unshift(cur); cur = prev.get(cur); } return chain; }
        next.push(h);
      }
      queue.length = 0; queue.push(...next); depth += 1;
    }
    return null;
  }
  function showCallEdge(fromId, toId, kind) {
    const from = fnById.get(fromId), to = fnById.get(toId); if (!from || !to) return;
    const sites = F.callPairs.filter((c) => c.s === fromId && c.t === toId).map((c) => c.line).filter(Boolean).sort((a, b) => a - b);
    const cross = fileById.get(from.file)?.module !== fileById.get(to.file)?.module;
    const path = from.file === to.file ? [from.file] : includePath(from.file, to.file);
    const callers = (callersOf.get(toId) ?? []).map((c) => fnById.get(c.s)).filter(Boolean);
    const callerFiles = [...new Set(callers.map((c) => c.file))];
    const kindLabel = { register: "注册（取函数地址）", schedule: "调度（按注册关系推导）", irq: "使能中断", call: "调用" }[kind ?? "call"];
    aside.dataset.currentFn = toId;
    aside.innerHTML = `<div class="search"><input id="fn-search" placeholder="输入函数名，倒推到入口" /><button id="fn-search-btn">倒推</button></div>
      <h2>${esc(from.name)} → ${esc(to.name)}</h2>
      <p class="sub">${esc(kindLabel)}${cross ? ` · 跨模块 <span class="pill">${esc(fmodule(fromId))}</span>→<span class="pill">${esc(fmodule(toId))}</span>` : " · 同模块"}</p>
      <h3>调用点 ${sites.length}</h3><p class="sub"><code>${esc(from.file.replace(F.region, ""))}</code>${sites.length ? sites.map((l) => `:${l}`).join(" ") : "（无行号信息）"}</p>
      <h3>include 路径</h3>${path ? `<p class="sub">${path.map((f, i) => `${i ? " → " : ""}<code>${esc(f.split("/").pop())}</code>`).join("")}${path.length > 2 ? `<br><span class="sub">经 ${path.length - 2} 层传递 include</span>` : ""}</p>` : `<p class="sub"><span class="pill warn">未经头文件</span>调用方没有任何直接或传递 include 指向被调方所在模块——多半是 <code>extern</code> 声明直调，绕过了头文件契约。</p>`}
      ${kind === "call" || !kind ? `<p class="sub">ArchCheck 判定：${bypassSet.has(`${fromId}→${toId}`) ? `<span class="pill warn">契约绕过</span>无 include 路径到被调模块（引擎口径）` : "非契约绕过"}${path && bypassSet.has(`${fromId}→${toId}`) ? "<br><span class=\"sub\">两边口径不同：预览沿 include 图追 5 层，引擎的传递深度更浅——深度是待定项</span>" : ""}</p>` : ""}
      <h3>被调函数的导出面</h3><p class="sub"><code>${esc(to.name)}</code> 定义于 <code>${esc(to.file.replace(F.region, ""))}:${to.line}</code>${cleanBrief(to.brief) ? `<br><span class="brief">${esc(cleanBrief(to.brief))}</span>` : ""}<br>被 ${callers.length} 处调用，来自 ${callerFiles.length} 个文件：${callerFiles.slice(0, 6).map((f) => esc(f.split("/").pop())).join("、")}${callerFiles.length > 6 ? "…" : ""}</p>
      <h3>执行域</h3><p class="sub">调用方 <span class="pill ${E.domains[fromId] === "isr" ? "isr" : E.domains[fromId] === "mixed" ? "both" : "task"}">${domainLabel[E.domains[fromId] ?? "unreached"]}</span> 被调方 <span class="pill ${E.domains[toId] === "isr" ? "isr" : E.domains[toId] === "mixed" ? "both" : "task"}">${domainLabel[E.domains[toId] ?? "unreached"]}</span></p>
      <p><button class="link" data-fn="${esc(fromId)}">← 调用方详情</button> · <button class="link" data-fn="${esc(toId)}">被调方详情 →</button></p>`;
    wireEntryAside();
  }

  // 文档注释里常见 "/*****" 分隔线或空壳，被 ArchCheck 记成 brief；只保留含字母的正文并截断
  function cleanBrief(text) {
    const t = String(text ?? "").replace(/[*=\-_#/]{3,}/g, " ").replace(/\s+/g, " ").trim();
    if (!/[A-Za-z一-鿿]{2,}/.test(t)) return "";
    return t.length > 160 ? `${t.slice(0, 157)}…` : t;
  }

  // ---- 双根对比：两个入口（典型是一个中断 + 一个任务）各自可达的函数与变量的交集
  const varName = (id) => String(id).split(":").pop();
  const varsTouchedBy = (fnIds) => { const m = new Map(); for (const r of F.referencePairs) if (fnIds.has(r.s)) { const rec = m.get(r.t) ?? new Set(); rec.add(r.s); m.set(r.t, rec); } return m; };
  const reachCache = new Map();
  const reachOf = (id) => { if (!reachCache.has(id)) { const s = under(id); s.add(id); reachCache.set(id, s); } return reachCache.get(id); };
  const cmp = { a: null, b: null };
  function comparePair(a, b) {
    const ra = reachOf(a), rb = reachOf(b);
    const sharedFns = [...ra].filter((id) => rb.has(id) && isRegionFnId(id));
    const va = varsTouchedBy(ra), vb = varsTouchedBy(rb);
    const sharedVars = [...va.keys()].filter((v) => vb.has(v)).map((v) => ({ id: v, name: varName(v), a: [...va.get(v)], b: [...vb.get(v)], global: F.globals.find((g) => g.name === varName(v)) }));
    return { ra, rb, sharedFns, sharedVars };
  }
  function shortestPath(fromId, toId) {
    const prev = new Map([[fromId, null]]); const q = [fromId];
    while (q.length) { const x = q.shift(); if (x === toId) { const chain = []; let cur = x; while (cur) { chain.push(cur); cur = prev.get(cur); } return chain.reverse(); } for (const c of calleesOf.get(x) ?? []) if (!prev.has(c.t)) { prev.set(c.t, x); q.push(c.t); } }
    return null;
  }
  function renderCompare() {
    const isrs = E.isrs.filter((i) => !i.kernel && reachOf(i.id).size > 1);
    const tasks = [...new Set(E.registrations.filter((r) => r.kind === "task").map((r) => r.id))];
    if (!cmp.a || !cmp.b) {
      let best = null;
      for (const i of isrs) for (const t of tasks) { const n = [...reachOf(i.id)].filter((x) => reachOf(t).has(x)).length; if (!best || n > best.n) best = { a: i.id, b: t, n }; }
      if (best) { cmp.a = cmp.a ?? best.a; cmp.b = cmp.b ?? best.b; }
    }
    const roots = [...isrs.map((i) => ({ id: i.id, kind: "isr" })), ...tasks.map((t) => ({ id: t, kind: "task" }))];
    const opt = (sel) => roots.map((r) => `<option value="${esc(r.id)}" ${r.id === sel ? "selected" : ""}>${r.kind === "isr" ? "中断" : "任务"} · ${esc(fname(r.id))}（${esc(fmodule(r.id))}）</option>`).join("");
    const result = cmp.a && cmp.b ? comparePair(cmp.a, cmp.b) : null;
    const rootCard = (id, side) => { const kind = isrIds.has(id) ? "isr" : "task"; const r = reachOf(id); return `<div class="cmp-root ${kind}"><span class="pill ${kind}">${kind === "isr" ? "中断" : "任务"}</span><b>${esc(fname(id))}</b><span class="sub">${esc(fmodule(id))} · 下面 ${r.size - 1} 个函数 · 触及 ${varsTouchedBy(r).size} 个变量</span><br><select data-cmp="${side}" style="margin-top:6px;max-width:100%">${opt(id)}</select></div>`; };
    // 矩阵：中断 × 任务 的共用函数数。全空的行列不画（席克定律），只在注脚说明藏了多少
    const shared = (a, b) => [...reachOf(a)].filter((x) => reachOf(b).has(x) && isRegionFnId(x)).length;
    const counts = new Map(isrs.map((i) => [i.id, new Map(tasks.map((t) => [t, shared(i.id, t)]))]));
    const liveIsrs = isrs.filter((i) => [...counts.get(i.id).values()].some(Boolean) || i.id === cmp.a);
    const liveTasks = tasks.filter((t) => isrs.some((i) => counts.get(i.id).get(t)) || t === cmp.b);
    const hidden = { isr: isrs.length - liveIsrs.length, task: tasks.length - liveTasks.length };
    const matrix = `<table class="cmp-matrix"><tr><th class="rowhead">中断 \\ 任务</th>${liveTasks.map((t) => `<th class="colhead" title="${esc(fname(t))}">${esc(short(fname(t).replace(/_task$/, ""), 22))}</th>`).join("")}</tr>${liveIsrs.map((i) => `<tr><th class="rowhead">${esc(fname(i.id))}</th>${liveTasks.map((t) => { const n = counts.get(i.id).get(t); const alpha = n ? Math.min(0.85, 0.15 + n / 12) : 0; return `<td class="cell ${cmp.a === i.id && cmp.b === t ? "selected" : ""}" data-pair="${esc(i.id)}|${esc(t)}" style="background:${n ? `rgba(124,58,237,${alpha})` : "transparent"};color:${alpha > 0.5 ? "#fff" : "inherit"}">${n || ""}</td>`; }).join("")}</tr>`).join("")}</table>
      ${hidden.isr || hidden.task ? `<p class="cmp-note">已隐藏与对方没有任何共用函数的 ${hidden.isr ? `${hidden.isr} 个中断` : ""}${hidden.isr && hidden.task ? "、" : ""}${hidden.task ? `${hidden.task} 个任务` : ""}——它们和任务/中断之间不存在函数级的并发交叠（变量级交叠仍可能存在，用下方下拉框任选一对查看）。</p>` : ""}`;
    $("panel-compare").innerHTML = `<div class="entries">
      <p class="cmp-note">并发安全审查的起点：一个中断和一个任务同时能到达的函数与变量。矩阵里的数字是共用函数数，点格子选一对。${A.present ? `变量一栏的读写方向、临界区保护和冲突置信度来自引擎 AST 层；全部冲突候选见"并发"页。` : `变量一栏目前只知道"两边都访问"，<b>还未区分读写</b>（需要 ArchCheck ≥ 0.3.0）。`}</p>
      ${matrix}
      ${result ? `<div class="cmp-head">${rootCard(cmp.a, "a")}<div class="cmp-mid"><b>${result.sharedFns.length}</b>共用函数<br><b>${result.sharedVars.length}</b>共用变量</div>${rootCard(cmp.b, "b")}</div>
      <h2>共用变量 <small>${result.sharedVars.length}</small></h2>
      <table class="cmp-table"><tr><th>变量</th><th>定义于</th>${A.present ? "<th>冲突</th><th>中断侧</th><th>任务侧</th>" : ""}<th>中断侧访问函数</th><th>任务侧访问函数</th><th>跨文件</th></tr>${result.sharedVars.sort((x, y) => (confRank(conflictByName.get(y.name)?.confidence) - confRank(conflictByName.get(x.name)?.confidence)) || ((y.a.length + y.b.length) - (x.a.length + x.b.length))).map((v) => { const c = conflictByName.get(v.name); return `<tr><td><code>${esc(v.name)}</code></td><td class="sub nowrap">${v.global?.definition ? `<code>${esc(v.global.definition.path.replace(F.region, ""))}:${v.global.definition.line}</code>` : "<span class=\"sub\">本文件内</span>"}</td>${A.present ? `<td class="nowrap">${c ? `<button class="link" data-conflict="${esc(c.name)}"><span class="conf ${c.confidence}"></span>${c.confidence}</button>` : "<span class=\"sub\">—</span>"}</td><td class="nowrap">${kindsGlyph(sideKinds(v.a, v.name))}</td><td class="nowrap">${kindsGlyph(sideKinds(v.b, v.name))}</td>` : ""}<td><details><summary class="sub">${v.a.length} 个函数</summary>${v.a.map((f) => `<button class="link" data-fn="${esc(f)}">${esc(fname(f))}</button>`).join("、")}</details></td><td><details><summary class="sub">${v.b.length} 个函数</summary>${v.b.map((f) => `<button class="link" data-fn="${esc(f)}">${esc(fname(f))}</button>`).join("、")}</details></td><td>${v.global ? "是" : ""}</td></tr>`; }).join("") || "<tr><td colspan=8>无</td></tr>"}</table>
      <h2>共用函数 <small>${result.sharedFns.length}</small></h2>
      <table class="cmp-table"><tr><th>函数</th><th>模块</th><th>从中断到它</th><th>从任务到它</th><th>它触及的变量</th></tr>${result.sharedFns.map((id) => { const pa = shortestPath(cmp.a, id) ?? [], pb = shortestPath(cmp.b, id) ?? []; const vs = [...(varsTouchedBy(new Set([id])).keys())].map(varName); return `<tr><td><button class="link" data-fn="${esc(id)}">${esc(fname(id))}</button><br><span class="sub">${esc(floc(id))}</span></td><td class="sub">${esc(fmodule(id))}</td><td class="sub">${pa.slice(1, -1).map((x) => esc(fname(x))).join(" → ") || "直接"}<br><span class="sub">${pa.length - 1} 跳</span></td><td class="sub">${pb.slice(1, -1).map((x) => esc(fname(x))).join(" → ") || "直接"}<br><span class="sub">${pb.length - 1} 跳</span></td><td class="sub">${vs.slice(0, 6).map(esc).join("、")}${vs.length > 6 ? ` …共 ${vs.length}` : ""}</td></tr>`; }).join("") || "<tr><td colspan=5>无</td></tr>"}</table>` : "<p>没有可比较的入口</p>"}
    </div>`;
    const panel = $("panel-compare");
    panel.querySelectorAll("[data-cmp]").forEach((s) => s.addEventListener("change", (e) => { cmp[s.dataset.cmp] = e.target.value; renderCompare(); }));
    panel.querySelectorAll("[data-pair]").forEach((td) => td.addEventListener("click", () => { const [a, b] = td.dataset.pair.split("|"); cmp.a = a; cmp.b = b; renderCompare(); }));
    panel.querySelectorAll("[data-fn]").forEach((b) => b.addEventListener("click", () => showEntry(b.dataset.fn)));
    panel.querySelectorAll("[data-conflict]").forEach((b) => b.addEventListener("click", () => { showConflict(b.dataset.conflict); }));
  }

  // ---- AST 层（ArchCheck ≥ 0.3.0）：运行模式、资源读写矩阵、临界区、状态图。没有这些字段时相关区块不渲染。
  const A = F.ast ?? { present: false, runModes: {}, loops: [], stateMachines: [], resourceAccesses: [], criticalSections: [], sharedResources: [], conflictCandidates: [] };
  const modeLabel = { periodic: "周期", "busy-poll": "忙轮询", "event-driven": "事件驱动", "one-shot": "单次", unknown: "未知" };
  const unitIdOf = (fnId) => regById.get(fnId)?.unitId ?? E.isrs.find((i) => i.id === fnId)?.unitId ?? (fnId === E.main ? "main:main" : null);
  const runModeOf = (fnId) => { const u = unitIdOf(fnId); return u ? A.runModes[u] ?? null : null; };
  const modeTitle = (rm) => { if (!rm?.evidence) return modeLabel[rm?.mode] ?? ""; const ev = rm.evidence; return `${modeLabel[rm.mode]} · ${rm.confidence}\n循环 ${ev.loop ? `${ev.loop.kind} @${ev.loop.location?.path?.split("/").pop()}:${ev.loop.location?.line}${ev.loop.infinite ? "（无限）" : ""}` : "无"}\n阻塞点 ${(ev.blockingCalls ?? []).map((b) => `${b.callee}:${b.location?.line}`).join(", ") || "无"}${ev.note ? `\n${ev.note}` : ""}`; };
  const periodText = (rm) => (rm?.periodMs != null ? `${rm.periodMs >= 1000 ? `${rm.periodMs / 1000} s` : `${rm.periodMs} ms`}` : null);
  const modePill = (fnId) => { const rm = runModeOf(fnId); if (!rm) return ""; const p = periodText(rm); return `<span class="mode ${esc(rm.mode)}" title="${esc(modeTitle(rm))}${rm.evidence?.period?.basis ? `\n周期依据：${esc(rm.evidence.period.basis.join("；"))}` : rm.evidence?.period?.reason ? `\n周期未知：${esc(rm.evidence.period.reason)}` : ""}">${modeLabel[rm.mode] ?? rm.mode}${p ? ` ${p}` : rm.mode === "periodic" ? " ?" : ""}</span>`; };
  const wakeByName = new Map((A.wakeRelations ?? []).map((w) => [w.name, w]));
  function renderModeStrip() {
    const tasks = E.registrations.filter((r) => r.kind === "task");
    const groups = new Map();
    for (const t of tasks) { const rm = A.runModes[t.unitId]; const key = rm?.mode ?? "unknown"; groups.set(key, [...(groups.get(key) ?? []), t]); }
    const order = ["periodic", "event-driven", "busy-poll", "one-shot", "unknown"];
    return `<div class="mode-strip">${order.filter((k) => groups.has(k)).map((k) => `<div class="grp"><b><span class="mode ${k}" style="margin-left:0">${modeLabel[k]}</span> ${groups.get(k).length}</b>${groups.get(k).map((t) => `<span title="${esc(modeTitle(A.runModes[t.unitId]))}">${entryButton(t.id)}</span>`).join("")}</div>`).join("")}</div>`;
  }
  const confRank = (c) => ({ high: 3, medium: 2, low: 1 }[c] ?? 0);
  const conflictByName = new Map(A.conflictCandidates.map((c) => [c.name, c]));
  const accessesByFn = new Map(); for (const a of A.resourceAccesses) accessesByFn.set(a.function, [...(accessesByFn.get(a.function) ?? []), a]);
  // 某一侧（函数集合）对某变量名的访问种类汇总：{ kinds, unprotected, n }
  const sideKinds = (fnIds, varName) => { const kinds = new Set(), unprotected = new Set(); let n = 0; for (const f of fnIds) for (const a of accessesByFn.get(f) ?? []) if (a.name === varName) { n += 1; kinds.add(a.kind); if (!a.inCriticalSection) unprotected.add(a.kind); } return { kinds, unprotected, n }; };

  // 并发页：变量 × 执行单元 的读写矩阵（只列有中断参与、且被 ≥2 个单元触及的变量），行按冲突置信度排序
  const conc = { selected: null };
  function renderConcurrency() {

    const rows = A.sharedResources.filter((r) => r.units.length >= 2 && r.units.some((u) => u.unitKind === "isr")).map((r) => ({ ...r, conflict: conflictByName.get(r.name) ?? null, wake: wakeByName.get(r.name) ?? null }));

    rows.sort((x, y) => (confRank(y.conflict?.confidence) - confRank(x.conflict?.confidence)) || ((x.wake ? 1 : 0) - (y.wake ? 1 : 0)) || (y.units.length - x.units.length) || x.name.localeCompare(y.name));

  function showConcurrencyStart() { if (conc.selected) showConflict(conc.selected); else { aside.innerHTML = `<div class="search"><input id="fn-search" placeholder="输入函数名，倒推到入口" /><button id="fn-search-btn">倒推</button></div><h2>并发</h2><p class="sub">点左侧任意变量，这里显示每一侧的访问函数、行号、读写种类与是否受临界区保护。</p>`; wireEntryAside(); } }

  // 状态机页：卡片列表 + 环形布局的状态图（状态 = 圆周上的节点，转换 = 带箭头的弧，虚线 = 经函数调用间接转换）
  const fsm = { selected: null, selectedState: null };
  // 状态机模型：把引擎给的 switch 候选整理成层级——分发表（无转换）单列；同一分派变量的多个 switch 合并成一台机；
  // 归属 = 哪个执行单元可达它；嵌套 = 某台机的 case 体内调用（≤3 跳）到达另一台机的函数；耦合 = 转换条件里出现另一台机所在文件的查询函数。
  let fsmModelCache = null;
  function fsmModel() {
    if (fsmModelCache) return fsmModelCache;
    const raw = A.stateMachines;
    const dispatchTables = raw.filter((m) => !m.transitions.length);

    const units = [...E.registrations.filter((r) => r.kind === "task"), ...E.registrations.filter((r) => r.kind === "handler"), ...E.isrs.filter((i) => !i.kernel).map((i) => ({ id: i.id, kind: "isr" }))];
    for (const m of machines) {

    // 嵌套：A 的某个 case 体内的调用在 ≤3 跳内到达 B 的函数 → B 是 A 该状态的子状态机；取最近的父
    const hops = (from, to) => { if (from === to) return 0; const seen = new Set([from]); let frontier = [from]; for (let d = 1; d <= 3; d += 1) { const next = []; for (const x of frontier) for (const c of calleesOf.get(x) ?? []) { if (c.t === to) return d; if (!seen.has(c.t)) { seen.add(c.t); next.push(c.t); } } frontier = next; } return null; };
    for (const b of machines) { b.parent = null; b.parentState = null; b.depth = 0; }

      let best = null;

    const fnByName = new Map(); for (const f of F.functions) if (f.file.startsWith(F.region)) fnByName.set(f.name, f);

  }
  const fsmById = (id) => fsmModel().machines.find((m) => m.id === id) ?? null;

  function renderFsm() {

    const card = (x, depth) => `<div class="fsm-card ${x.id === m?.id ? "selected" : ""}" data-fsm="${esc(x.id)}" style="margin-left:${depth * 18}px"><b><span class="conf ${x.confidence}"></span>${depth ? "↳ " : ""}<code>${esc(x.dispatch)}</code>${x.members.length > 1 ? ` <span class="sub">×${x.members.length} switch</span>` : ""}</b><span class="sub">${x.parent ? `在 <code>${esc(fsmById(x.parent)?.dispatch ?? "?")}</code> 的状态 ${esc(x.parentState ?? "?")} 内，经 ${esc(fname(x.parentVia))}` : `${x.functions.map((f) => esc(fname(f))).join("、")} · ${esc(floc(x.function))}`}</span><br><span class="sub">${x.states.length} 态 · ${x.transitions.length} 转换${x.enumType ? ` · <code>${esc(x.enumType)}</code>` : ""}${x.writersElsewhere.length ? ` · 外部改写 ${x.writersElsewhere.length}` : ""}${x.waitsOn.length ? ` · 等待 ${x.waitsOn.map((w) => `<code>${esc(fsmById(w.id)?.dispatch ?? "?")}</code>`).join("、")}` : ""}${x.owners.length > 1 ? ` · 共 ${x.owners.length} 个单元可达` : ""}</span>${x.children.length ? x.children.map((c) => card(c, depth + 1)).join("") : ""}</div>`;

    const tree = ownerOrder.map((o) => `<div class="fsm-owner"><div class="fsm-owner-head">${ownerLabel(o)}</div>${machines.filter((x) => !x.parent && ownerKey(x) === o).sort((x, y) => (confRank(y.confidence) - confRank(x.confidence)) || (y.transitions.length - x.transitions.length)).map((x) => card(x, 0)).join("")}</div>`).join("");
    const crumbs = []; { let cur = m; while (cur) { crumbs.unshift(cur); cur = cur.parent ? fsmById(cur.parent) : null; } }
    panel.innerHTML = `<div class="entries">
      <p class="cmp-note">引擎把 <code>switch(变量)</code> 当状态机候选：case 标签是状态，switch 内对分派变量的赋值是转换（包围它的 if 条件作为近似转换条件）。这里按事实把候选整理成层级：<b>归属</b>哪个执行单元可达（reachability）、<b>嵌套</b>哪台机的 case 体内调用到达另一台（调用图 ≤3 跳）、<b>合并</b>同一分派变量的多个 switch、<b>等待</b>转换条件里调用了另一台机所在文件的函数。没有任何转换的 switch 是分发表，单列在底部。近似：函数指针分发处嵌套会断；等待关系只认名字出现。</p>

    svg.querySelectorAll("[data-cv-fn]").forEach((g) => g.addEventListener("click", (event) => { event.stopPropagation(); const id = g.dataset.cvFn; if (tree.open.has(id)) tree.open.delete(id); else tree.open.add(id); tree.selected = id; showEntry(id); renderTreeCanvas(); }));
    svg.querySelectorAll("[data-cv-group]").forEach((g) => g.addEventListener("click", (event) => { event.stopPropagation(); const key = g.dataset.cvGroup; if (tree.open.has(key)) tree.open.delete(key); else tree.open.add(key); renderTreeCanvas(); }));
    svg.querySelectorAll("[data-cv-edge]").forEach((g) => g.addEventListener("click", (event) => { event.stopPropagation(); const [from, to, kind] = g.dataset.cvEdge.split("|"); tree.selectedEdge = { from, to }; showCallEdge(from, to, kind); renderTreeCanvas(); }));
  }
  // 适应视图：整棵树能放下就放下；放不下时不缩到看不清（下限 0.6），改为以选中节点为中心
  function fitTreeCanvas() {
    const svg = $("tree-canvas"); if (!svg || !tree.canvasBounds) return;
    const rect = svg.getBoundingClientRect();
    const fitK = Math.min(1.1, (rect.width - 20) / tree.canvasBounds.width, (rect.height - 20) / tree.canvasBounds.height);
    const selected = tree.selected ? tree.canvasNodes?.find((n) => n.kind === "fn" && n.id === tree.selected) : null;
    if (fitK >= 0.6 || !selected) { tree.canvasView = { k: Math.max(0.6, fitK), x: 10, y: 10 }; }
    else { const k = 1; const cx = CV.pad + selected.depth * CV.col + CV.cardW / 2, cy = CV.pad + selected.row * CV.row + CV.cardH / 2; tree.canvasView = { k, x: rect.width * 0.6 - cx * k, y: rect.height / 2 - cy * k }; }
    $("tree-canvas-vp").setAttribute("transform", `translate(${tree.canvasView.x},${tree.canvasView.y}) scale(${tree.canvasView.k})`);
  }
  function wireTreeCanvas() {
    const svg = $("tree-canvas"); if (!svg) return; let drag = null;
    svg.addEventListener("wheel", (event) => { event.preventDefault(); const f = event.deltaY < 0 ? 1.1 : 0.9; const r = svg.getBoundingClientRect(); const px = event.clientX - r.left, py = event.clientY - r.top; const v = tree.canvasView; tree.canvasView = { k: Math.min(3, Math.max(0.2, v.k * f)), x: px - (px - v.x) * f, y: py - (py - v.y) * f }; $("tree-canvas-vp").setAttribute("transform", `translate(${tree.canvasView.x},${tree.canvasView.y}) scale(${tree.canvasView.k})`); }, { passive: false });
    svg.addEventListener("mousedown", (event) => { if (event.target === svg) drag = { x: event.clientX, y: event.clientY, vx: tree.canvasView.x, vy: tree.canvasView.y }; });
    window.addEventListener("mousemove", (event) => { if (drag) { tree.canvasView.x = drag.vx + event.clientX - drag.x; tree.canvasView.y = drag.vy + event.clientY - drag.y; $("tree-canvas-vp").setAttribute("transform", `translate(${tree.canvasView.x},${tree.canvasView.y}) scale(${tree.canvasView.k})`); } });
    window.addEventListener("mouseup", () => { drag = null; });
    $("tree-canvas-fit")?.addEventListener("click", fitTreeCanvas);
    $("tree-canvas-collapse")?.addEventListener("click", () => { tree.open = new Set([tree.root]); renderTreeCanvas(); fitTreeCanvas(); });
  }

  function renderTree() {
    tree.rendered = new Map(); tree.counter = 0;
    const roots = [{ label: "复位 → main", id: E.main }];
    const isrRoots = E.isrs.filter((i) => !i.kernel).map((i) => ({ label: `中断 · ${fname(i.id)}（${fmodule(i.id)}）`, id: i.id }));
    const taskRoots = [...new Set(E.registrations.filter((r) => r.kind === "task").map((r) => r.id))].map((id) => ({ label: `任务 · ${fname(id)}（${fmodule(id)}）`, id }));
    const handlerRoots = [...new Set(E.registrations.filter((r) => r.kind === "handler").map((r) => r.id))].map((id) => ({ label: `处理器 · ${fname(id)}（${fmodule(id)}）`, id }));
    const option = (r) => `<option value="${esc(r.id)}" ${r.id === tree.root ? "selected" : ""}>${esc(r.label)}</option>`;
    const order = activationOrder(tree.root);
    $("panel-tree").innerHTML = `<div class="entries">
      <div class="treebar">
        <label class="sub" style="font-size:12px;color:var(--muted)">从哪个入口开始</label>
        <select id="tree-root"><optgroup label="程序入口">${roots.map(option).join("")}</optgroup><optgroup label="中断入口 ${isrRoots.length}">${isrRoots.map(option).join("")}</optgroup><optgroup label="任务 ${taskRoots.length}">${taskRoots.map(option).join("")}</optgroup><optgroup label="处理器 ${handlerRoots.length}">${handlerRoots.map(option).join("")}</optgroup></select>
        <button class="toggle ${tree.groupByModule ? "active" : ""}" data-toggle="groupByModule" title="跨模块的子节点按目标模块折叠成一组">按模块分组</button>
        <button class="toggle ${tree.showLibrary ? "active" : ""}" data-toggle="showLibrary" title="显示对 GD32 库、components 等区域外函数的调用">显示库调用</button>
        <button class="toggle ${tree.showScheduling ? "active" : ""}" data-toggle="showScheduling" title="thread_run 到各任务的那一跳在事实里不存在（调度器经函数指针），这里按注册关系推导画出，标为“调度·推导”">推导调度边</button>
        <span class="seg"><button data-view="list" class="${tree.view === "list" ? "active" : ""}">列表</button><button data-view="canvas" class="${tree.view === "canvas" ? "active" : ""}">画布</button></span>
        <span class="note" style="color:var(--muted);font-size:11px">子节点按调用点行号排序（源码顺序 ≈ 初始化顺序，不代表运行时时序）</span>
      </div>
      <div class="order"><span>模块首次触及顺序：</span>${order.map((o, i) => `<span class="step" title="首次经由 ${esc(fname(o.via))} 进入">${i + 1}. ${esc(o.module)}</span>`).join('<span>→</span>')}</div>
      ${tree.view === "canvas"
        ? `<div class="tcanvas-wrap"><svg class="tcanvas" id="tree-canvas"><g id="tree-canvas-vp"></g></svg><div class="tcanvas-tools"><button id="tree-canvas-collapse">只留根</button><button id="tree-canvas-fit">适应</button></div><div class="tcanvas-hint">向右 = 调用更深 · 向下 = 源码顺序 · 点节点展开/收起 · 黄色 = 跨模块分组 · 红框 = 未经头文件 · 紫点 = 中断+任务共用 · 滚轮缩放、拖拽平移</div></div>`
        : `<div class="xtree">${renderTreeNode(tree.root, [], null)}</div>`}
    </div>`;
    const panel = $("panel-tree");
    panel.querySelector("#tree-root").addEventListener("change", (event) => { tree.root = event.target.value; tree.openPath = new Set(); tree.open = new Set([tree.root]); renderTree(); showEntry(tree.root); });
    panel.querySelectorAll("[data-toggle]").forEach((b) => b.addEventListener("click", () => { tree[b.dataset.toggle] = !tree[b.dataset.toggle]; renderTree(); }));
    panel.querySelectorAll("[data-view]").forEach((b) => b.addEventListener("click", () => { tree.view = b.dataset.view; renderTree(); }));
    panel.addEventListener("click", (event) => { const b = event.target.closest("[data-edge-from]"); if (!b) return; event.preventDefault(); event.stopPropagation(); showCallEdge(b.dataset.edgeFrom, b.dataset.edgeTo, b.dataset.edgeKind); });
    if (tree.view === "canvas") { if (tree.openPath.size) for (const id of tree.openPath) tree.open.add(id); renderTreeCanvas(); wireTreeCanvas(); fitTreeCanvas(); }
    panel.querySelectorAll("[data-tree-fn]").forEach((b) => b.addEventListener("click", (event) => { event.preventDefault(); event.stopPropagation(); showEntry(b.dataset.treeFn); }));
    panel.addEventListener("toggle", (event) => {
      const details = event.target; if (!(details instanceof HTMLDetailsElement) || !details.open || !details.dataset.treeNode) return;
      const kids = details.querySelector(":scope > .kids"); if (!kids || kids.childElementCount) return;
      const ancestors = details.dataset.anc ? details.dataset.anc.split("|") : [];
      kids.innerHTML = renderTreeChildren(details.dataset.treeNode, [...ancestors, details.dataset.treeNode]);
      kids.querySelectorAll("[data-tree-fn]").forEach((b) => b.addEventListener("click", (e) => { e.preventDefault(); e.stopPropagation(); showEntry(b.dataset.treeFn); }));
    }, true);
  }
  // 从入口页或搜索结果跳到树里：把到入口的链设为展开路径
  function revealInTree(fnId) {
    const chain = chainToEntry(fnId);
    if (!chain) { tree.root = fnId; tree.openPath = new Set(); }
    else { tree.root = chain[0]; tree.openPath = new Set(chain); }
    tree.selected = fnId;
    tree.open = new Set([tree.root, ...tree.openPath]);
    switchTab("tree");
    window.setTimeout(() => { const target = [...$("panel-tree").querySelectorAll("[data-tree-node]")].find((d) => d.dataset.treeNode === fnId); target?.scrollIntoView({ block: "center" }); target?.querySelector("summary")?.classList.add("selected"); }, 30);
  }

  function switchTab(tab) { state.tab = tab; $("tabs").querySelectorAll("button").forEach((b) => b.classList.toggle("active", b.dataset.tab === tab)); for (const name of ["entries", "run", "tree", "compare", "concurrency", "fsm", "seq", "isr", "beat", "memory", "deps"]) $(`panel-${name}`).classList.toggle("hidden", tab !== name); if (tab === "entries") { renderEntries(); showEntriesStart(); } if (tab === "tree") { renderTree(); if (!aside.querySelector("#fn-search")) showEntry(tree.root); } if (tab === "compare") { renderCompare(); if (!aside.querySelector("#fn-search")) showEntriesStart(); } if (tab === "concurrency") { renderConcurrency(); showConcurrencyStart(); } if (tab === "fsm") { renderFsm(); } if (tab === "seq") { renderSeq(); } if (tab === "isr") { renderSeq1(); } if (tab === "beat") { renderBeat(); } if (tab === "run") { renderRunMap2(); } if (tab === "memory") renderMemory();
    if (tab === "deps") renderDeps(); }
  $("tabs").addEventListener("click", (event) => { const button = event.target.closest("button"); if (button) switchTab(button.dataset.tab); });

  const counted = moduleEdges.filter((e) => ["same", "up", "down", "skip"].includes(e.cls));
  const internalFiles = F.files.filter((f) => f.path.startsWith(F.region));
  $("hdr-project").textContent = ` · ${F.partition.name} · ${F.region}`;
  $("stats").innerHTML = `<span>入口 <b>${1 + E.counts.isrs + E.counts.tasks + E.counts.handlers}</b></span><span>模块 <b>${F.modules.filter((m) => !m.external).length}</b> · 文件 <b>${internalFiles.length}</b> · 函数 <b>${E.counts.functions}</b></span><span class="warn">未触达函数 <b>${E.counts.unreached}</b></span>${F.coverage ? `<span title="区域内进入编译数据库的源文件数；被排除的文件在入口页底部列出">覆盖 <b>${F.coverage.regionAnalyzed}</b> 源文件${F.coverage.regionExcluded.length ? `<span class="warn">（${F.coverage.regionExcluded.length} 个未编译）</span>` : ""}</span>` : ""}<span class="bad">互相依赖 <b>${(() => { const ids = new Set(moduleEdges.map((e) => `${e.s}→${e.t}`)); return moduleEdges.filter((e) => e.s < e.t && ids.has(`${e.t}→${e.s}`)).length; })()}</b> 对模块</span><span class="bad">循环 <b>${F.cycles.reduce((n, c) => n + c.length, 0)}</b> 文件</span><span>隐式全局接口 <b>${F.globals.length}</b></span>`;
  const hashParams = new URLSearchParams(location.hash.slice(1));
  const initialTab = hashParams.get("tab") ?? "entries";
  if (hashParams.get("view") === "canvas") tree.view = "canvas";
  switchTab(initialTab);
  const byName = (name) => F.functions.find((fn) => fn.name === name && fn.file.startsWith(F.region));
  const presetFn = hashParams.get("fn");
  if (presetFn) { const match = byName(presetFn); if (match) { showEntry(match.id); revealInTree(match.id); } }
  if (hashParams.get("a") && hashParams.get("b")) { const a = byName(hashParams.get("a")), b = byName(hashParams.get("b")); if (a && b) { cmp.a = a.id; cmp.b = b.id; switchTab("compare"); } }
  if (hashParams.get("edge")) { const [fromName, toName] = hashParams.get("edge").split("|"); const from = byName(fromName), to = byName(toName); if (from && to) showCallEdge(from.id, to.id, "call"); }
})();
</script>
</body>
</html>
