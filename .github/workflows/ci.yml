name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  tools:
    name: 工具链与插件
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm test

  engine:
    name: 引擎与语料
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      # AST 层建在 clangd 的 LSP 上，没有它引擎只能做依赖层
      - run: sudo apt-get update && sudo apt-get install -y clangd
      - run: pip install ./engine
      - run: node tools/corpus-smoke.mjs
