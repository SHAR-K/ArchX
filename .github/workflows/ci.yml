name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  tools:
    name: 工具链与插件
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm test
      # 插件从 GitHub 装（claude plugin marketplace add SHAR-K/ArchX），拿到的是仓库里提交的 MCP 服务与本地网页模板。
      # npm test 会重新构建它们；构建结果和提交的不一致，就是改了源码忘了提交产物
      - name: Committed plugin build is up to date
        run: git diff --exit-code -- extension/claude-marketplace/plugins/archx/server extension/claude-marketplace/plugins/archx/viewer

  engine:
    name: 引擎与语料
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      # AST 层建在 clangd 的 LSP 上，没有它引擎只能做依赖层
      - run: sudo apt-get update && sudo apt-get install -y clangd
      - run: pip install ./engine
      - run: node tools/corpus-smoke.mjs
