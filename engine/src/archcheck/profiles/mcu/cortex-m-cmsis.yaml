# ArchCheck profile — 规则即数据：引擎不认识任何具体函数名，全部来自这里。
# Rules are data: the engine knows no API name of its own; everything comes from files like this.
# 字段说明 / field reference: profiles/README.md
name: cortex-m-cmsis
kind: mcu
description: 'Cortex-M CMSIS 内核层：NVIC_EnableIRQ 使能，__disable_irq / __enable_irq 与 NVIC_DisableIRQ / EnableIRQ 临界区。Cortex-M
  CMSIS core: NVIC_EnableIRQ, __disable_irq / __enable_irq and NVIC disable / enable pairs.'
# 32 位内核：单次 load / store 最宽 4 字节是原子的。32-bit core: a single 4-byte load / store is atomic.
atomic_width_bytes: 4
# SysTick 配置：CMSIS 标准签名，重载值是第 0 个实参（SystemCoreClock / N）。
systick_config:
- rule: cmsis.SysTick_Config
  function: SysTick_Config
  reload_argument: 0
isr_enable:
- rule: cmsis.NVIC_EnableIRQ
  function: NVIC_EnableIRQ
  irq_argument: 0
critical_section:
- rule: cmsis.disable_irq
  begin: __disable_irq
  end: __enable_irq
  kind: irq
- rule: cmsis.NVIC_DisableIRQ
  begin: NVIC_DisableIRQ
  end: NVIC_EnableIRQ
  kind: irq
  match_argument: true
